name: Supabase Migrations (Production)

# Applies migrations to PRODUCTION Supabase only when main changes.
# Local / Preview use originpass-dev via CLI link + Vercel Preview envs — never this workflow.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/schema.sql"

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Guard — production project ref only
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          EXPECTED_PROD_REF="myempzxqncdmobnvgbur"
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing GitHub secret SUPABASE_PROJECT_REF"
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" != "$EXPECTED_PROD_REF" ]; then
            echo "Refusing to migrate: SUPABASE_PROJECT_REF=$SUPABASE_PROJECT_REF (expected $EXPECTED_PROD_REF)"
            exit 1
          fi
          echo "OK: targeting production Supabase ref $SUPABASE_PROJECT_REF"

      - name: Apply migrations to production
        env:
          # ACCESS_TOKEN / PROJECT_REF are production-scoped (see Guard step).
          # DB password still lives in legacy secret name SUPABASE_DB_PASSWORD_DEV
          # (created with the original originpass project — it is the PRODUCTION password).
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD_DEV secret"
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --yes
