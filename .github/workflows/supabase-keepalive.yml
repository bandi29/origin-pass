# Keep Free-tier Supabase projects from auto-pausing after ~7 days of inactivity.
# Docs: https://supabase.com/docs/guides/platform/free-project-pausing
#
# Required GitHub repo secrets:
#   SUPABASE_PROJECT_REF          (already used by migrate → myempzxqncdmobnvgbur)
#   SUPABASE_SERVICE_ROLE_KEY     (production service role — add if missing)
#
# Optional (also keep originpass-dev warm):
#   SUPABASE_DEV_PROJECT_REF      (jmecvwpgfprmlvteiwkh)
#   SUPABASE_DEV_SERVICE_ROLE_KEY
#
# When you upgrade to Pro, delete this workflow — paid projects never pause for inactivity.

name: Supabase keep-alive

on:
  schedule:
    # Every 3 days at 08:00 UTC — well inside the 7-day free-tier pause window.
    - cron: "0 8 */3 * *"
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Free-tier projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping production (originpass)
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_REF:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Missing SUPABASE_PROJECT_REF or SUPABASE_SERVICE_ROLE_KEY repo secrets."
            exit 1
          fi
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/organizations?select=id&limit=1"
          code=$(curl -sS -o /tmp/keepalive-prod.json -w "%{http_code}" "$url" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json")
          echo "production HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::Production keep-alive failed"
            cat /tmp/keepalive-prod.json || true
            exit 1
          fi

      - name: Ping development (originpass-dev, optional)
        env:
          SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
          SUPABASE_DEV_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DEV_PROJECT_REF:-}" ] || [ -z "${SUPABASE_DEV_SERVICE_ROLE_KEY:-}" ]; then
            echo "Skipping originpass-dev (optional secrets not set)."
            exit 0
          fi
          url="https://${SUPABASE_DEV_PROJECT_REF}.supabase.co/rest/v1/organizations?select=id&limit=1"
          code=$(curl -sS -o /tmp/keepalive-dev.json -w "%{http_code}" "$url" \
            -H "apikey: ${SUPABASE_DEV_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_DEV_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json")
          echo "development HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::Development keep-alive failed"
            cat /tmp/keepalive-dev.json || true
            exit 1
          fi
